<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#2d2a3f">
    <link rel="icon" type="image/jpeg" href="images/images.jpg">
    <title>Administrator Secret Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #52476a, #2d2a3f 62%);
            color: #fff;
            font: 14px Inter, Arial, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px
        }

        .card {
            width: min(530px, 100%);
            background: #252236eF;
            border: 1px solid #ffffff32;
            box-shadow: 0 24px 80px #16132299;
            padding: 38px;
            border-radius: 12px;
            text-align: center
        }

        .logo {
            width: 74px;
            height: 74px;
            object-fit: contain;
            margin-bottom: 13px
        }

        .kicker {
            color: #ffd438;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .22em;
            text-transform: uppercase
        }

        .amount {
            font-size: 38px;
            font-weight: 900;
            margin: 12px 0 20px
        }

        .amount span {
            color: #ffd438
        }

        .card h1 {
            font-size: 22px;
            margin: 0 0 12px
        }

        .card p {
            color: #d0cddd;
            font-size: 12px;
            line-height: 1.75;
            margin: 0 0 18px
        }

        .notice {
            border: 1px solid #ffd43869;
            background: #ffd43813;
            padding: 14px;
            border-radius: 7px;
            color: #fff6d5;
            font-size: 11px;
            line-height: 1.65;
            margin: 20px 0
        }

        .actions {
            display: grid;
            gap: 10px
        }

        .primary,
        .secondary {
            display: block;
            padding: 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .primary {
            background: #ffd438;
            color: #282338
        }

        .secondary {
            border: 1px solid #ffffff4b;
            color: #fff
        }

        .support-copy {
            margin: 18px 0 0;
            color: #fff2c2;
            font-size: 11px;
            line-height: 1.6
        }

        .back {
            display: inline-block;
            color: #c9c3d4;
            font-size: 10px;
            margin-top: 20px;
            text-decoration: none
        }

        .back:hover {
            color: #ffd438
        }

        @media(max-width:520px) {
            .card {
                padding: 27px 21px
            }

            .amount {
                font-size: 33px
            }
        }
    </style>
</head>
<body>
    <main class="card"><img class="logo" src="images/logo.png" alt="Administrator Secret Panel"><div class="kicker">Administrator Secret Panel</div><h1>Account locked</h1><p>We are here for you. Contact the only available administrator for help restoring access.</p><p class="support-copy"><a href="https://wa.me/2349037141652">Administrator: 09037141652</a></p><a class="back" href="index.html">← Back</a></main>
    
</body>

</html>
